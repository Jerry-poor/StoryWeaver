<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryWeaver</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a31;
      --panel-2: #0f172a;
      --line: #25304d;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent-2: #f59e0b;
      --danger: #f87171;
      --code: #0b1222;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(94, 234, 212, 0.08), transparent 30%),
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 25%),
        linear-gradient(180deg, #09111f 0%, #0b1020 100%);
      color: var(--text);
    }
    header {
      padding: 20px 24px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      background: rgba(11, 16, 32, 0.86);
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    header .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .wrap {
      display: grid;
      grid-template-columns: 300px 1fr 360px;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 80px);
    }
    .card {
      background: rgba(18, 26, 49, 0.9);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .card h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }
    .stack { display: grid; gap: 12px; padding: 14px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      background: linear-gradient(180deg, rgba(94,234,212,0.18), rgba(94,234,212,0.08));
      border: 1px solid rgba(94,234,212,0.35);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button.secondary {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
    }
    button.warning {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.35);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea, input, select {
      width: 100%;
      background: rgba(7, 12, 25, 0.95);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
    }
    textarea {
      min-height: 420px;
      resize: vertical;
      line-height: 1.55;
      white-space: pre;
    }
    .small { font-size: 12px; color: var(--muted); }
    .section {
      display: grid;
      gap: 8px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .tab {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active {
      background: rgba(94,234,212,0.14);
      border-color: rgba(94,234,212,0.35);
    }
    .editor-wrap { padding: 14px; }
    .panel {
      background: rgba(7, 12, 25, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
    }
    .preview-card {
      background: rgba(7, 12, 25, 0.78);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
    }
    .preview-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .preview-card .muted {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .preview-card ul {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--text);
    }
    .stream-log {
      display: grid;
      gap: 10px;
      max-height: 520px;
      overflow: auto;
      padding: 14px;
    }
    .bubble {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px;
      background: rgba(7, 12, 25, 0.82);
    }
    .bubble.user {
      border-color: rgba(245,158,11,0.3);
      background: rgba(245,158,11,0.08);
    }
    .bubble.assistant {
      border-color: rgba(94,234,212,0.3);
      background: rgba(94,234,212,0.06);
    }
    .bubble .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bubble pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .result {
      min-height: 180px;
      max-height: 420px;
      overflow: auto;
      background: rgba(7,12,25,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .status {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }
    .status strong { color: var(--text); }
    .chapter-text { white-space: pre-wrap; line-height: 1.9; font-size: 13px; }
    @media (max-width: 1200px) {
      .wrap { grid-template-columns: 1fr; }
      textarea { min-height: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>StoryWeaver</h1>
    <div class="sub">纯 JSON 方案，DeepSeek OpenAI 兼容接口，章节生成强制参考大纲 / 角色表 / 故事线 / 最近 10 轮对话。</div>
  </header>
  <main class="wrap">
    <section class="card">
      <h2>项目文件</h2>
      <div class="stack">
        <div class="btns">
          <button class="tab active" data-file="story_brief">story_brief.json</button>
          <button class="tab" data-file="outline_draft">outline_draft.json</button>
          <button class="tab" data-file="outline">outline.json</button>
          <button class="tab" data-file="characters">characters.json</button>
          <button class="tab" data-file="storyline">storyline.json</button>
          <button class="tab" data-file="conversation_memory">conversation_memory.json</button>
        </div>
        <div class="section">
          <div class="small">当前文件</div>
          <div id="currentFile" class="panel">outline.json</div>
        </div>
        <div class="section">
          <div class="small">操作</div>
          <div class="btns">
            <button id="reloadBtn" class="secondary">重新加载</button>
            <button id="saveBtn">保存当前文件</button>
            <button id="resetBtn" class="warning">重置默认文件</button>
          </div>
        </div>
        <!-- ① 大纲阶段：outline 未确认时显示 -->
        <div id="outlineSection" class="section">
          <div class="small">故事描述</div>
          <textarea id="storyBriefInput" style="min-height:140px" placeholder="先用一句话或一段话描述你的故事，我会先生成大纲。"></textarea>
          <div class="btns">
            <button id="generateOutlineBtn">生成大纲</button>
            <button id="confirmOutlineBtn" class="secondary">确认大纲</button>
          </div>
          <div id="outlineState" class="panel">大纲状态：未加载</div>
        </div>
        <!-- ② 章节阶段：outline 已确认后显示，与大纲阶段共用左栏 -->
        <div id="chapterSection" class="section" style="display:none">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="small">生成章节</div>
            <span style="font-size:11px;color:var(--accent);padding:3px 8px;border-radius:999px;border:1px solid rgba(94,234,212,0.3);background:rgba(94,234,212,0.08);">大纲已确认</span>
          </div>
          <div class="grid2">
            <input id="chapterNo" type="number" min="1" value="1" placeholder="章节编号" />
            <input id="lengthTarget" type="number" min="200" value="1800" placeholder="目标字数" />
          </div>
          <input id="chapterTitle" type="text" placeholder="章节标题（可选，留空自动提取）" />
          <input id="chapterTone" type="text" placeholder="章节语气（可选）" />
          <textarea id="chapterInstruction" style="min-height:100px" placeholder="章节生成指令，例如：本章增加冲突，强化悬念"></textarea>
          <div class="btns">
            <button id="generateBtn">生成章节</button>
            <button class="secondary" id="viewOutlineBtn">查看大纲</button>
          </div>
          <div id="chapterOutlineState" class="panel" style="font-size:12px;"></div>
        </div>
        <div class="section">
          <div class="small">章节编辑（不计入历史）</div>
          <div class="grid2" style="margin-bottom:4px;">
            <input id="chatChapterNo" type="number" min="1" value="1" placeholder="章节编号" />
            <div style="display:flex;align-items:center;font-size:12px;color:var(--muted);">指定要修改的章节</div>
          </div>
          <textarea id="chatInput" style="min-height:80px" placeholder="修改指令，例如：把竅斗场景写得更激烈"></textarea>
          <button id="chatBtn" class="secondary">修改章节</button>
        </div>
        <div class="section">
          <div class="small">状态</div>
          <div id="status" class="panel">等待操作。</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); padding-right: 16px;">
        <h2 style="border:none; background:transparent;">文件预览与编辑</h2>
        <div class="tabs" style="border:none; padding:0; gap:4px;" id="previewTabs">
          <button class="tab preview-tab active" data-preview="story_brief">简介</button>
          <button class="tab preview-tab" data-preview="outline">大纲</button>
          <button class="tab preview-tab" data-preview="characters">角色</button>
          <button class="tab preview-tab" data-preview="storyline">故事线</button>
          <button class="tab preview-tab" data-preview="memory">记忆</button>
          <button class="tab preview-tab" data-preview="text">正文</button>
        </div>
      </div>
      <div style="margin: 14px; min-height: 120px; max-height: 480px; overflow-y: auto;">
        <div id="dynamicPreviewMeta" style="margin-bottom:8px; font-weight:bold; font-size:13px; color:var(--accent);">等待加载...</div>
        <div id="dynamicPreviewBody"></div>
      </div>
      <div class="editor-wrap">
        <div class="small" style="margin-bottom:8px; color:var(--muted);">当前 JSON 源码 (随左侧项目文件选中切换)</div>
        <textarea id="editor" spellcheck="false" style="min-height: 220px;"></textarea>
      </div>
      <div class="status"><strong>提示：</strong>上方通过按钮切换预览，下方是选中文件的 JSON 源码。</div>
    </section>

    <section class="card">
      <h2>实时输出</h2>
      <div class="stream-log" id="streamLog"></div>
      <div class="status"><strong>提示：</strong>生成时会以对话气泡方式逐步输出。</div>
    </section>

  </main>

  <script>
    const state = {
      currentFile: 'story_brief',
      currentPreview: 'story_brief',
      chapterTexts: {},      // chapter_no → { title, text, updates }
      previewChapter: null,  // currently selected chapter in 正文 tab
      files: {},
    };

    const fileLabels = {
      story_brief: 'story_brief.json',
      outline_draft: 'outline_draft.json',
      outline: 'outline.json',
      characters: 'characters.json',
      storyline: 'storyline.json',
      conversation_memory: 'conversation_memory.json',
    };

    const editor = document.getElementById('editor');
    const storyBriefInput = document.getElementById('storyBriefInput');
    const currentFileEl = document.getElementById('currentFile');
    const outlineStateEl = document.getElementById('outlineState');
    const statusEl = document.getElementById('status');
    const dynamicPreviewMeta = document.getElementById('dynamicPreviewMeta');
    const dynamicPreviewBody = document.getElementById('dynamicPreviewBody');
    const streamLog = document.getElementById('streamLog');
    const generateBtn = document.getElementById('generateBtn');

    function isOutlineConfirmed() {
      return (state.files.outline || {}).status === 'confirmed';
    }

    function pretty(data) {
      return JSON.stringify(data, null, 2);
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function setStatus(text, color = '') {
      statusEl.textContent = text;
      statusEl.style.color = color || '';
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function parseSseFrame(frame) {
      const lines = frame.split(/\r?\n/);
      let event = 'message';
      const dataLines = [];
      for (const line of lines) {
        if (line.startsWith('event:')) {
          event = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          dataLines.push(line.slice(5).trimStart());
        }
      }
      return { event, data: dataLines.join('\n') };
    }

    async function streamApi(path, payload, handlers = {}) {
      const res = await fetch(`${path}?stream=1`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'text/event-stream',
        },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let finalPayload = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          if (!frame.trim()) continue;
          const event = parseSseFrame(frame);
          if (event.event === 'chunk') {
            handlers.onChunk?.(event.data);
          } else if (event.event === 'meta') {
            handlers.onMeta?.(event.data);
          } else if (event.event === 'final') {
            finalPayload = JSON.parse(event.data);
            handlers.onFinal?.(finalPayload);
          } else if (event.event === 'error') {
            const err = JSON.parse(event.data);
            throw new Error(err.error || 'stream error');
          }
        }
      }
      return finalPayload;
    }

    function addBubble(role, title, text = '') {
      const node = document.createElement('div');
      node.className = `bubble ${role}`;
      node.innerHTML = `
        <div class="label">${escapeHtml(title)}</div>
        <pre>${escapeHtml(text)}</pre>
      `;
      streamLog.appendChild(node);
      streamLog.scrollTop = streamLog.scrollHeight;
      return node.querySelector('pre');
    }

    function parseSseChunk(text) {
      try {
        const payload = JSON.parse(text);
        return payload.text || '';
      } catch (e) {
        return text;
      }
    }

    function switchPreview(type) {
      state.currentPreview = type;
      renderDynamicPreview();
    }

    function selectPreviewChapter(no) {
      state.previewChapter = no;
      if (!state.chapterTexts[no]) {
        fetch(`/api/chapter/${no}`).then(r => r.json()).then(data => {
          if (data.chapter_text) {
            state.chapterTexts[no] = { title: data.title || `第${no}章`, text: data.chapter_text, updates: data };
            renderDynamicPreview();
          }
        }).catch(() => {});
        return;
      }
      renderDynamicPreview();
    }

    // Dynamic Preview Rendering
    function renderDynamicPreview() {
      const type = state.currentPreview;
      let meta = '';
      let body = '';

      if (type === 'story_brief') {
        const data = state.files.story_brief || {};
        meta = '故事简介文本';
        body = `<div style="line-height:1.6; white-space:pre-wrap;">${escapeHtml(data.description || '暂无简介')}</div>`;
      } 
      else if (type === 'outline') {
        // Use confirmed outline if confirmed_at is set, otherwise fall back to draft
        const confirmed = state.files.outline;
        const isConfirmed = confirmed && confirmed.confirmed_at;
        const outline = isConfirmed ? confirmed : (state.files.outline_draft || {});
        const hasData = outline.title || (Array.isArray(outline.chapter_plan) && outline.chapter_plan.length > 0);
        meta = isConfirmed
          ? `已确认 · ${outline.title || '未命名'}`
          : hasData
            ? `草案 · ${outline.title || '(未命名)'}`
            : '等待生成大纲';
        const plans = Array.isArray(outline.chapter_plan) ? outline.chapter_plan : [];
        body = hasData ? `
          <div class="small">题材：${escapeHtml(outline.genre || '未设置')}</div>
          <div class="small">主题：${escapeHtml(outline.theme || '未设置')}</div>
          <div style="margin-top:8px; line-height:1.6;">${escapeHtml(outline.logline || '暂无简介')}</div>
          <div class="small" style="margin-top:10px;">章节计划 ${plans.length} 章</div>
          <ul style="margin-top:8px;">
            ${plans.slice(0, 20).map(item => `<li style="margin-bottom:6px;"><strong>第${item.chapter_no || '?'}章：</strong>${escapeHtml(item.goal || '')}</li>`).join('')}
            ${plans.length > 20 ? '<li>...</li>' : ''}
          </ul>
        ` : '<div class="muted">尚未生成大纲，请先在左侧输入故事描述并点击「生成大纲」。</div>';
      } 
      else if (type === 'characters') {
        const chars = state.files.characters?.characters || [];
        meta = `角色列表 · 共 ${chars.length} 人`;
        body = '<div style="display:flex; flex-direction:column; gap:12px;">' + chars.map(c => {
          let fieldsHtml = '';
          for (const [k, v] of Object.entries(c)) {
            if (['id', 'name', 'role'].includes(k)) continue;
            let displayVal;
            if (Array.isArray(v)) {
              displayVal = v.length > 0 ? v.join('、') : '无';
            } else if (v !== null && typeof v === 'object') {
              // Nested object: show each sub-field on its own line
              const subFields = Object.entries(v)
                .map(([sk, sv]) => {
                  const sv2 = Array.isArray(sv) ? sv.join('、') : String(sv);
                  return `<span style="color:var(--muted);">${escapeHtml(sk)}:</span> ${escapeHtml(sv2)}`;
                }).join(' &nbsp;·&nbsp; ');
              fieldsHtml += `<div class="small" style="margin-bottom:6px;"><div style="color:var(--text); margin-bottom:2px;">${escapeHtml(k)}：</div><div style="padding-left:8px; color:var(--muted);">${subFields}</div></div>`;
              continue;
            } else {
              displayVal = (v !== null && v !== undefined && v !== '') ? String(v) : '无';
            }
            fieldsHtml += `<div class="small" style="margin-bottom:4px;"><span style="color:var(--text);">${escapeHtml(k)}：</span>${escapeHtml(displayVal)}</div>`;
          }
          return `
          <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
            <div style="font-weight:bold; color:var(--accent); margin-bottom:6px;">${escapeHtml(c.name || '未命名')} <span class="muted small" style="font-weight:normal;">(${escapeHtml(c.role || '')})</span></div>
            ${fieldsHtml}
          </div>
        `}).join('') + '</div>';
        if (chars.length === 0) body = '<div class="muted">暂无角色，生成大纲后会自动提取角色设定。</div>';
      }
      else if (type === 'storyline') {
        const storyline = state.files.storyline || {};
        const chapters = Array.isArray(storyline.chapter_summaries) ? storyline.chapter_summaries : [];
        meta = `已记录 ${chapters.length} 章`;
        const chapterListHtml = chapters.length > 0
          ? '<ul style="margin-top:4px;">' + chapters.map(item => {
              // item can be a string or an object with chapter_no/title/summary
              if (typeof item === 'object' && item !== null) {
                const title = item.title ? `《${item.title}》` : `第${item.chapter_no || '?'}章`;
                const summaryArr = Array.isArray(item.summary) ? item.summary : (item.summary ? [item.summary] : []);
                return `<li style="margin-bottom:6px;"><strong>${escapeHtml(title)}</strong>${summaryArr.length > 0 ? '：' + escapeHtml(summaryArr.join('；')) : ''}</li>`;
              }
              return `<li style="margin-bottom:4px;">${escapeHtml(String(item))}</li>`;
            }).join('') + '</ul>'
          : '<div class="muted" style="margin-top:4px;">尚无章节记录</div>';
        body = `
          <div style="line-height:1.6; margin-bottom:12px;">${escapeHtml(storyline.overall_summary || '暂无故事线摘要')}</div>
          <div class="small" style="color:var(--accent); margin-bottom:4px;">章节记录</div>
          ${chapterListHtml}
          <div class="small" style="color:var(--danger); margin-bottom:4px; margin-top:12px;">未解决线索</div>
          <ul style="margin-top:0;">
            ${(storyline.open_threads || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li class="muted">无</li>'}
          </ul>
        `;
      }
      else if (type === 'memory') {
        const memory = state.files.conversation_memory || {};
        const summary = memory.dialogue_summary || {};
        const turns = (memory.recent_turns || []).filter(t => t.type !== 'chapter').slice(-5).reverse();
        meta = '记忆与对话约束';
        const turnsHtml = turns.length > 0
          ? turns.map(t => `<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:8px;border-radius:8px;margin-bottom:6px;"><div class="small" style="margin-bottom:4px;"><span style="color:var(--accent-2);">User:</span> ${escapeHtml(t.user)}</div><div class="small"><span style="color:var(--accent);">Agent:</span> ${escapeHtml((t.assistant||'').substring(0,150))}${(t.assistant||'').length>150?'...':''}</div></div>`).join('')
          : '<div class="muted">暂无记录</div>';
        body = `
          <div class="small" style="color:var(--accent-2); margin-bottom:4px;">确认过的约束</div>
          <ul style="margin-top:0;margin-bottom:10px;">${(summary.confirmed_constraints||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('')||'<li class="muted">无</li>'}</ul>
          <div class="small" style="color:var(--accent); margin-bottom:4px;">最近对话</div>
          ${turnsHtml}
        `;
      }
      else if (type === 'text') {
        const nos = Object.keys(state.chapterTexts).map(Number).sort((a,b)=>a-b);
        meta = nos.length > 0 ? `正文预览 · ${nos.length} 章` : '正文预览 · 暂无已生成章节';
        const btnStyle = (no) => {
          const ch = state.chapterTexts[no];
          const confirmed = ch && ch.status === 'confirmed';
          return state.previewChapter === no
            ? 'background:rgba(94,234,212,0.18);border:1px solid rgba(94,234,212,0.45);color:var(--accent);'
            : 'background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--text);';
        };
        const selector = nos.length > 0
          ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">${nos.map(no=>`<button onclick="selectPreviewChapter(${no})" style="padding:4px 12px;font-size:12px;border-radius:999px;cursor:pointer;${btnStyle(no)}">第${no}章</button>`).join('')}</div>`
          : '';
        const cur = state.previewChapter !== null ? state.chapterTexts[state.previewChapter] : null;
        let textArea = '';
        if (cur) {
          const updatesHtml = buildUpdatesHtml(cur.updates || {});
          const isConfirmed = cur.status === 'confirmed';
          const statusBadge = isConfirmed
            ? `<span style="font-size:11px;color:var(--accent);padding:2px 8px;border-radius:999px;border:1px solid rgba(94,234,212,0.4);background:rgba(94,234,212,0.1);margin-left:8px;">✓ 已确认</span>`
            : `<span style="font-size:11px;color:var(--accent-2);padding:2px 8px;border-radius:999px;border:1px solid rgba(245,158,11,0.4);background:rgba(245,158,11,0.08);margin-left:8px;">草稿</span>`;
          const confirmBtn = isConfirmed ? '' :
            `<button onclick="confirmChapter(${state.previewChapter})" style="margin-top:12px;padding:8px 18px;font-size:13px;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,rgba(94,234,212,0.22),rgba(94,234,212,0.1));border:1px solid rgba(94,234,212,0.4);color:var(--text);">✓ 确认章节</button>`;
          textArea = `<div style="color:var(--accent);font-weight:bold;margin-bottom:8px;">《${escapeHtml(cur.title)}》${statusBadge}</div>${confirmBtn}<div class="chapter-text" style="margin-top:10px;">${escapeHtml(cur.text)}</div>${updatesHtml ? '<hr style="border-color:rgba(255,255,255,0.06);margin:14px 0;">'+updatesHtml : ''}`;
        } else if (nos.length > 0) {
          textArea = '<div class="muted">请选择章节查看正文</div>';
        } else {
          textArea = '<div class="muted">暂无章节，请先生成章节。</div>';
        }
        body = selector + textArea;
      }

      dynamicPreviewMeta.textContent = meta;
      dynamicPreviewBody.innerHTML = body;
      document.querySelectorAll('.preview-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preview === type);
      });
    }

    function buildUpdatesHtml(updates) {
      if (!updates || Object.keys(updates).length === 0) return '';
      let html = '';
      if ((updates.chapter_summary||[]).length) html += '<div class="small" style="color:var(--accent);margin-bottom:4px;">章节摘要</div><ul>'+updates.chapter_summary.map(s=>`<li>${escapeHtml(s)}</li>`).join('')+'</ul>';
      if ((updates.new_events||[]).length) html += '<div class="small" style="color:var(--accent-2);margin-top:8px;margin-bottom:4px;">新事件</div><ul>'+updates.new_events.map(s=>`<li>${escapeHtml(s)}</li>`).join('')+'</ul>';
      if ((updates.open_threads||[]).length) html += '<div class="small" style="color:var(--danger);margin-top:8px;margin-bottom:4px;">新增悬念</div><ul>'+updates.open_threads.map(s=>`<li>${escapeHtml(s)}</li>`).join('')+'</ul>';
      if ((updates.character_updates||[]).length) html += '<div class="small" style="color:var(--text);margin-top:8px;margin-bottom:4px;">角色状态更新</div><ul>'+updates.character_updates.map(c=>`<li><strong>${escapeHtml(c.id)}</strong> ${escapeHtml(JSON.stringify(c.current_state_changes||{}))}</li>`).join('')+'</ul>';
      if ((updates.new_characters||[]).length) html += '<div class="small" style="color:var(--accent);margin-top:8px;margin-bottom:4px;">新角色出场</div><ul>'+updates.new_characters.map(c=>`<li><strong>${escapeHtml(c.name)}</strong> (${escapeHtml(c.role||'')})</li>`).join('')+'</ul>';
      return html;
    }

    async function loadState() {
      setStatus('正在加载项目文件...');
      const data = await api('/api/state', { method: 'GET' });
      state.files = data;
      if (!storyBriefInput.value.trim()) {
        storyBriefInput.value = (data.story_brief && data.story_brief.description) || '';
      }
      // Load available chapter numbers
      try {
        const chNos = await api('/api/chapters', { method: 'GET' });
        (chNos.chapters || []).forEach(no => {
          if (!state.chapterTexts[no]) state.chapterTexts[no] = null; // placeholder
        });
        // Auto-select latest chapter if none selected
        if (state.previewChapter === null && (chNos.chapters||[]).length > 0) {
          state.previewChapter = chNos.chapters[chNos.chapters.length - 1];
        }
      } catch(_) {}
      renderCurrentFile();
      renderDynamicPreview();
      syncFlowState();
      setStatus('项目文件已加载。', '#94f7d6');
    }

    function renderCurrentFile() {
      const data = state.files[state.currentFile] || {};
      currentFileEl.textContent = fileLabels[state.currentFile];
      editor.value = pretty(data);
      document.querySelectorAll('.tab:not(.preview-tab)').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.file === state.currentFile);
      });
      
      let pTarget = state.currentFile;
      if (pTarget === 'outline_draft') pTarget = 'outline';
      if (pTarget === 'conversation_memory') pTarget = 'memory';
      if (document.querySelector(`.preview-tab[data-preview="${pTarget}"]`)) {
        state.currentPreview = pTarget;
        renderDynamicPreview();
      }
    }

    function syncFlowState() {
      const confirmed = isOutlineConfirmed();
      const outlineTitle = (state.files.outline || {}).title || '未命名';
      document.getElementById('outlineSection').style.display = confirmed ? 'none' : '';
      document.getElementById('chapterSection').style.display = confirmed ? '' : 'none';
      if (confirmed) {
        outlineStateEl.textContent = `已确认：${outlineTitle}`;
      } else {
        outlineStateEl.textContent = '大纲状态：未确认，先生成大纲草案并确认后才能生成章节';
        document.getElementById('confirmOutlineBtn').disabled = !state.files.outline_draft;
      }
      generateBtn.disabled = !confirmed;
    }

    function applyOutlineDraft(draft) {
      state.files.outline_draft = draft;
      state.currentFile = 'outline_draft';
      renderCurrentFile();
      syncFlowState();
    }

    function applyConfirmedOutline(outline) {
      state.files.outline = outline;
      renderDynamicPreview();
      syncFlowState();
    }

    document.querySelectorAll('.tab:not(.preview-tab)').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentFile = btn.dataset.file;
        renderCurrentFile();
      });
    });

    document.querySelectorAll('.preview-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentPreview = btn.dataset.preview;
        renderDynamicPreview();
      });
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      try {
        setStatus('正在保存...');
        const payload = JSON.parse(editor.value);
        const data = await api('/api/save', {
          method: 'POST',
          body: JSON.stringify({ name: state.currentFile, json_text: editor.value }),
        });
        state.files[state.currentFile] = payload;
        if (state.currentFile === 'conversation_memory') renderMemory();
        renderDynamicPreview();
        setStatus(`已保存 ${fileLabels[state.currentFile]}。`, '#94f7d6');
      } catch (err) {
        setStatus(`保存失败：${err.message}`, '#fca5a5');
      }
    });

    document.getElementById('generateOutlineBtn').addEventListener('click', async () => {
      try {
        const storyBrief = storyBriefInput.value.trim();
        if (!storyBrief) return setStatus('请输入故事描述。', '#fca5a5');
        setStatus('正在生成大纲...');
        const userBubble = addBubble('user', '用户', storyBrief);
        const assistantBubble = addBubble('assistant', 'DeepSeek', '');
        let markdownBuffer = '';
        
        const payload = await streamApi('/api/generate-outline', { story_brief: storyBrief }, {
          onChunk: (text) => {
            markdownBuffer += parseSseChunk(text);
            if (markdownBuffer.indexOf('```json') !== -1) {
                assistantBubble.innerHTML = `<div class="label">DeepSeek</div><div style="line-height:1.5;">${escapeHtml(markdownBuffer.split('```json')[0])}</div><div class="muted small" style="margin-top:8px;">[正在生成结构化 JSON...]</div>`;
            } else {
                assistantBubble.innerHTML = `<div class="label">DeepSeek</div><div style="line-height:1.5; white-space: pre-wrap;">${escapeHtml(markdownBuffer)}</div>`;
            }
          },
          onFinal: (finalPayload) => {
            state.files.story_brief = { description: storyBrief, created_at: finalPayload.record?.generated_at || '', updated_at: finalPayload.record?.generated_at || '' };
            applyOutlineDraft(finalPayload.outline_draft || {});
            state.files.conversation_memory = finalPayload.memory || state.files.conversation_memory;
            renderMemory();
            assistantBubble.innerHTML = `<div class="label">DeepSeek</div><div style="line-height:1.5;">大纲草案已生成。请在上方检查并确认。</div>`;
          },
        });
        if (payload?.outline_draft) state.files.outline_draft = payload.outline_draft;
        await loadState();
        setStatus('大纲草案已生成，请检查并确认。', '#94f7d6');
      } catch (err) {
        setStatus(`生成大纲失败：${err.message}`, '#fca5a5');
      }
    });

    document.getElementById('confirmOutlineBtn').addEventListener('click', async () => {
      try {
        setStatus('正在确认大纲...');
        let outlineJson = editor.value;
        if (state.currentFile !== 'outline_draft') outlineJson = JSON.stringify(state.files.outline_draft || {}, null, 2);
        const payload = await api('/api/confirm-outline', {
          method: 'POST',
          body: JSON.stringify({ outline_json: outlineJson, story_brief: storyBriefInput.value.trim() }),
        });
        applyConfirmedOutline(payload.outline);
        state.currentFile = 'outline';
        await loadState();
        renderCurrentFile();
        syncFlowState();
        setStatus('大纲已确认，可以开始生成章节。', '#94f7d6');
      } catch (err) {
        setStatus(`确认大纲失败：${err.message}`, '#fca5a5');
      }
    });

    document.getElementById('reloadBtn').addEventListener('click', async () => {
      try { await loadState(); } catch (err) { setStatus(`加载失败：${err.message}`, '#fca5a5'); }
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm('确认重置为默认 JSON 文件？')) return;
      try {
        setStatus('正在重置...');
        streamLog.innerHTML = '';
        storyBriefInput.value = '';
        document.getElementById('chapterTitle').value = '';
        document.getElementById('chapterInstruction').value = '';
        document.getElementById('chatInput').value = '';
        state.chapterTexts = {};
        state.previewChapter = null;
        await api('/api/reset', { method: 'POST', body: '{}' });
        await loadState();
        setStatus('已重置为默认文件。', '#94f7d6');
      } catch (err) {
        setStatus(`重置失败：${err.message}`, '#fca5a5');
      }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      try {
        if (!isOutlineConfirmed()) return setStatus('请先确认大纲后再生成章节。', '#fca5a5');
        setStatus('正在生成章节...');
        const chapterNo = Number(document.getElementById('chapterNo').value || 1);
        const bubblePre = addBubble('assistant', `第 ${chapterNo} 章`, '');
        let contentBuffer = '';
        const payload = await streamApi('/api/generate-chapter', {
          chapter_no: chapterNo,
          chapter_title: document.getElementById('chapterTitle').value,
          tone: document.getElementById('chapterTone').value,
          length_target: Number(document.getElementById('lengthTarget').value || 1800),
          instruction: document.getElementById('chapterInstruction').value,
        }, {
          onChunk: (text) => {
            contentBuffer += parseSseChunk(text);
            bubblePre.textContent = contentBuffer;
            // 实时刷新正文 tab
            state.chapterTexts[chapterNo] = { title: `第${chapterNo}章`, text: contentBuffer, updates: {} };
            state.previewChapter = chapterNo;
            if (state.currentPreview === 'text') renderDynamicPreview();
            streamLog.scrollTop = streamLog.scrollHeight;
          },
          onFinal: (fp) => {
            const title = fp.title || `第${chapterNo}章`;
            state.chapterTexts[chapterNo] = { title, text: fp.chapter_text || contentBuffer, updates: fp.updates || {} };
            state.previewChapter = chapterNo;
            if (fp.memory) state.files.conversation_memory = fp.memory;
            // 切换到正文 tab
            state.currentPreview = 'text';
            renderDynamicPreview();
          },
        });
        if (payload) {
          const title = payload.title || `第${chapterNo}章`;
          state.chapterTexts[chapterNo] = { title, text: payload.chapter_text || contentBuffer, updates: payload.updates || {} };
        }
        await loadState();
        setStatus(`第 ${(payload||{}).chapter_no ?? chapterNo} 章已生成并写回 JSON。`, '#94f7d6');
      } catch (err) {
        setStatus(`生成失败：${err.message}`, '#fca5a5');
      }
    });

    document.getElementById('viewOutlineBtn').addEventListener('click', () => switchPreview('outline'));

    document.getElementById('chatBtn').addEventListener('click', async () => {
      try {
        const message = document.getElementById('chatInput').value.trim();
        if (!message) return setStatus('\u8bf7\u8f93\u5165\u4fee\u6539\u6307\u4ee4\u3002', '#fca5a5');
        const chapterNo = Number(document.getElementById('chatChapterNo').value || 0);
        setStatus(`\u6b63\u5728\u4fee\u6539\u7b2c ${chapterNo} \u7ae0...`);
        const bubblePre = addBubble('assistant', `\u7f16\u8f91\u7b2c ${chapterNo} \u7ae0`, '');
        let buf = '';
        const payload = await streamApi('/api/chat', { message, chapter_no: chapterNo }, {
          onChunk: (text) => {
            buf += parseSseChunk(text);
            bubblePre.textContent = buf;
            // Live update text preview
            if (chapterNo > 0) {
              state.chapterTexts[chapterNo] = Object.assign({}, state.chapterTexts[chapterNo] || {}, { text: buf, status: 'draft' });
              state.previewChapter = chapterNo;
              if (state.currentPreview === 'text') renderDynamicPreview();
            }
            streamLog.scrollTop = streamLog.scrollHeight;
          },
          onFinal: (fp) => {
            if (fp.reply && chapterNo > 0) {
              state.chapterTexts[chapterNo] = Object.assign({}, state.chapterTexts[chapterNo] || {}, {
                text: fp.reply, status: 'draft',
                title: (state.chapterTexts[chapterNo] || {}).title || `\u7b2c${chapterNo}\u7ae0`,
              });
              state.previewChapter = chapterNo;
              state.currentPreview = 'text';
              renderDynamicPreview();
            }
          },
        });
        setStatus(`\u7b2c ${chapterNo} \u7ae0\u5df2\u4fee\u6539\uff08\u672a\u786e\u8ba4\uff09\u3002`, '#94f7d6');
      } catch (err) {
        setStatus(`\u4fee\u6539\u5931\u8d25\uff1a${err.message}`, '#fca5a5');
      }
    });

    async function confirmChapter(chapterNo) {
      try {
        setStatus(`\u6b63\u5728\u786e\u8ba4\u7b2c ${chapterNo} \u7ae0...`);
        const data = await api('/api/confirm-chapter', {
          method: 'POST',
          body: JSON.stringify({ chapter_no: chapterNo }),
        });
        // Update local cache with confirmed status and extracted updates
        if (state.chapterTexts[chapterNo]) {
          state.chapterTexts[chapterNo] = Object.assign({}, state.chapterTexts[chapterNo], {
            status: 'confirmed',
            title: data.title || state.chapterTexts[chapterNo].title,
            updates: data.updates || {},
          });
        }
        if (data.memory) state.files.conversation_memory = data.memory;
        // Refresh storyline and characters from server
        await loadState();
        state.currentPreview = 'text';
        state.previewChapter = chapterNo;
        renderDynamicPreview();
        setStatus(`\u7b2c ${chapterNo} \u7ae0\u5df2\u786e\u8ba4\uff0c\u6545\u4e8b\u7ebf / \u89d2\u8272\u5df2\u66f4\u65b0\u3002`, '#94f7d6');
      } catch (err) {
        setStatus(`\u786e\u8ba4\u5931\u8d25\uff1a${err.message}`, '#fca5a5');
      }
    }

    loadState().catch(err => setStatus(`\u521d\u59cb\u5316\u5931\u8d25\uff1a${err.message}`, '#fca5a5'));
  </script>
</body>
</html>
